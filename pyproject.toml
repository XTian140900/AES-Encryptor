
[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "aes-file-vault"
version = "0.1.0"
description = "Local file encryption and decryption using AES-256-GCM"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "cryptography>=44.0.0",
]

[project.scripts]
aes-file-vault = "aes_file_vault.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["aes_file_vault*"]
namespaces = false
